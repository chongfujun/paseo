name: Desktop Release (Fork)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach release artifacts (e.g. v0.1.75-chongfujun)"
        required: true
        type: string
      platform:
        description: "Platform to build"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - windows
          - linux

env:
  DESKTOP_PACKAGE_PATH: "packages/desktop"

jobs:
  build-macos:
    if: github.event.inputs.platform == 'macos'
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Add swap space for tsc
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Swap added: $(free -h | grep Swap)"

      - name: Build workspace packages
        env:
          NODE_OPTIONS: "--max-old-space-size=16384"
        run: npm run build:daemon

      - name: Export web app
        run: cd packages/app && npx expo export --platform web

      - name: Build macOS desktop arm64 (cross-compiled, unsigned)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          npx electron-builder --config electron-builder.yml --publish never --mac --arm64 -c.mac.notarize=false
        working-directory: packages/desktop

      - name: Build macOS desktop x64 (cross-compiled, unsigned)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          npx electron-builder --config electron-builder.yml --publish never --mac --x64 -c.mac.notarize=false
        working-directory: packages/desktop

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find "$release_dir" -maxdepth 1 -type f ! -name '*.yml' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifacts found in $release_dir"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "  $(basename "$f") ($(du -h "$f" | cut -f1))"
          done
          tag="${{ github.event.inputs.tag }}"
          gh release upload "$tag" "${files[@]}" --clobber --repo "${{ github.repository }}"

  build-windows:
    if: github.event.inputs.platform == 'windows'
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build workspace packages
        env:
          NODE_OPTIONS: "--max-old-space-size=16384"
        run: npm run build:daemon

      - name: Export web app
        run: cd packages/app && npx expo export --platform web

      - name: Build desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx electron-builder --config electron-builder.yml --publish never --win --x64 --arm64
        working-directory: packages/desktop

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find "$release_dir" -maxdepth 1 -type f ! -name '*.yml' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifacts found in $release_dir"
            exit 1
          fi
          tag="${{ github.event.inputs.tag }}"
          gh release upload "$tag" "${files[@]}" --clobber --repo "${{ github.repository }}"

  build-linux:
    if: github.event.inputs.platform == 'linux'
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Install Linux display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build workspace packages
        env:
          NODE_OPTIONS: "--max-old-space-size=16384"
        run: npm run build:daemon

      - name: Export web app
        run: cd packages/app && npx expo export --platform web

      - name: Build desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx electron-builder --config electron-builder.yml --publish never --linux --x64
        working-directory: packages/desktop

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find "$release_dir" -maxdepth 1 -type f ! -name '*.yml' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifacts found in $release_dir"
            exit 1
          fi
          tag="${{ github.event.inputs.tag }}"
          gh release upload "$tag" "${files[@]}" --clobber --repo "${{ github.repository }}"
