name: Desktop Release (Fork)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach release artifacts (e.g. v0.1.75-chongfujun)"
        required: true
        type: string
      platform:
        description: "Platform to build"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - windows
          - linux

env:
  DESKTOP_PACKAGE_PATH: "packages/desktop"

jobs:
  build-macos:
    if: github.event.inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            electron_arch: arm64
          - runner: macos-15-intel
            electron_arch: x64
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build workspace packages
        run: |
          npm run build --workspace=@getpaseo/highlight
          npm run build --workspace=@getpaseo/expo-two-way-audio
          npm run build --workspace=@getpaseo/relay
          cd packages/server && npx tsgo -p tsconfig.server.json --outDir ./dist/server && npx tsgo -p tsconfig.scripts.json --outDir ./dist/scripts && node -e "const fs=require('node:fs'); fs.mkdirSync('dist/server/server/speech/providers/local/sherpa/assets',{recursive:true}); fs.copyFileSync('src/server/speech/providers/local/sherpa/assets/silero_vad.onnx','dist/server/server/speech/providers/local/sherpa/assets/silero_vad.onnx'); fs.cpSync('src/terminal/shell-integration','dist/server/terminal/shell-integration',{recursive:true}); fs.cpSync('src/terminal/shell-integration','dist/src/terminal/shell-integration',{recursive:true}); fs.copyFileSync('src/terminal/terminal-ts-loader.mjs','dist/server/terminal/terminal-ts-loader.mjs'); fs.copyFileSync('scripts/mcp-stdio-socket-bridge-cli.mjs','dist/scripts/mcp-stdio-socket-bridge-cli.mjs');"
          cd ../..
          npm run build --workspace=@getpaseo/cli

      - name: Export web app
        run: cd packages/app && npx expo export --platform web

      - name: Build desktop (unsigned, no notarize)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          cd packages/desktop && npx tsgo --noEmit -p tsconfig.json
          npx electron-builder --config electron-builder.yml --publish never --mac --${{ matrix.electron_arch }} -c.mac.notarize=false

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find "$release_dir" -maxdepth 1 -type f ! -name '*.yml' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifacts found in $release_dir"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "  $(basename "$f") ($(du -h "$f" | cut -f1))"
          done
          tag="${{ github.event.inputs.tag }}"
          gh release upload "$tag" "${files[@]}" --clobber --repo "${{ github.repository }}"

  build-windows:
    if: github.event.inputs.platform == 'windows'
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build:daemon

      - name: Export web app
        run: cd packages/app && npx expo export --platform web

      - name: Build desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd packages/desktop && npx electron-builder --config electron-builder.yml --publish never --win --x64 --arm64

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find "$release_dir" -maxdepth 1 -type f ! -name '*.yml' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifacts found in $release_dir"
            exit 1
          fi
          tag="${{ github.event.inputs.tag }}"
          gh release upload "$tag" "${files[@]}" --clobber --repo "${{ github.repository }}"

  build-linux:
    if: github.event.inputs.platform == 'linux'
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Install Linux display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build workspace packages
        run: npm run build:daemon

      - name: Export web app
        run: cd packages/app && npx expo export --platform web

      - name: Build desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd packages/desktop && npx electron-builder --config electron-builder.yml --publish never --linux --x64

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find "$release_dir" -maxdepth 1 -type f ! -name '*.yml' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifacts found in $release_dir"
            exit 1
          fi
          tag="${{ github.event.inputs.tag }}"
          gh release upload "$tag" "${files[@]}" --clobber --repo "${{ github.repository }}"
